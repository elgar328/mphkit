[project]
name = "mphkit"
version = "0.4.0.dev0"
description = "Helpers on top of MPh for COMSOL in Python: build geometry, select by location, insert library materials, check a model before solving, summarize and compare models' settings, and read results as numbers or pictures."
readme = "README.md"
authors = [{ name = "elgar328" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["comsol", "mph", "multiphysics", "geometry", "selection",
            "simulation", "fem"]
requires-python = ">=3.10"
dependencies = ["mph>=1.4,<2", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/elgar328/mphkit"
Repository = "https://github.com/elgar328/mphkit"
Changelog = "https://github.com/elgar328/mphkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/elgar328/mphkit/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
# a test that gives a step or outer value by number on purpose says so
filterwarnings = ["error::mphkit.StepWarning"]
markers = [
    "comsol: needs COMSOL (running or installed); set by conftest.py",
]
