# Uploads a release to PyPI when a GitHub Release is published
# (docs/RELEASING.md). PyPI trusts this workflow through Trusted
# Publishing, so no token is stored anywhere.
#
# Run it by hand (workflow_dispatch) for a dry run: it checks and builds,
# but skips the tag comparison and the upload.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - name: Read the version
        id: version
        run: |
          version=$(uv version --short)
          echo "version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches the version
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Check version and changelog
        run: uv run --locked pytest tests/test_release.py
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mphkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
